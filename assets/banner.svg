<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Nova by Aowei Chen</title>
  <desc id="desc">A C++20 agent workbench in progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#162847"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68d8d6"/>
      <stop offset="1" stop-color="#9a9cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9cb7da" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1010" cy="145" r="220" fill="none" stroke="#88b5ff" stroke-opacity=".16" stroke-width="1.5"/>
    <circle cx="1010" cy="145" r="165" fill="none" stroke="#88b5ff" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="1010" cy="145" r="110" fill="none" stroke="url(#accent)" stroke-opacity=".58" stroke-width="2"/>
    <path d="M0 284H710" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
    <rect x="58" y="55" width="8" height="8" rx="2" fill="#68d8d6"/>
    <text x="80" y="64" fill="#a9bdd6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2">AOWEICHENN / CURRENT PROJECT</text>
    <text x="58" y="153" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Nova</text>
    <rect x="58" y="179" width="102" height="4" rx="2" fill="url(#accent)"/>
    <text x="58" y="224" fill="#b5c9e6" font-family="Arial, Helvetica, sans-serif" font-size="21">C++20 agent workbench · by Aowei Chen</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#d2e4fb">
      <rect x="795" y="74" width="320" height="178" rx="16" fill="#0a1529" stroke="#7ca5d2" stroke-opacity=".35"/>
      <circle cx="824" cy="99" r="5" fill="#68d8d6"/><circle cx="844" cy="99" r="5" fill="#9a9cff"/><circle cx="864" cy="99" r="5" fill="#4a688e"/>
      <path d="M813 118H1095" stroke="#7ca5d2" stroke-opacity=".3"/>
      <text x="819" y="153"><tspan fill="#68d8d6">runtime</tspan><tspan fill="#a5bad6">   C++20</tspan></text>
      <text x="819" y="187"><tspan fill="#9a9cff">clients</tspan><tspan fill="#a5bad6">   web / TUI / CLI</tspan></text>
      <text x="819" y="221"><tspan fill="#9bc8ff">status</tspan><tspan fill="#a5bad6">    in progress</tspan></text>
    </g>
